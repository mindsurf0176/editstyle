name: editstyle CI

on:
  push:
    branches: [master, main, "revival/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -e ".[app,mcp,dev]"
      - name: Lint
        run: ruff check editstyle/ plugins/resolve tests/test_style_bridge.py tests/test_skill_bundle.py tests/test_companion.py tests/test_host_bridge.py scripts/build-plugins.py scripts/build-skill.py
      - name: Test style API and real stdio MCP
        run: python -m unittest discover -s tests -p test_style_bridge.py -v
      - name: Test and build the portable skill bundle
        run: |
          python -m unittest discover -s tests -p test_skill_bundle.py -v
          python scripts/build-skill.py
      - name: Test companion and real media interchange
        run: python -m unittest discover -s tests -p test_companion.py -v
      - name: Test native host bridge and source-media interchange
        run: python -m unittest tests.test_host_bridge -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Premiere SDK contracts and build development plugin bundles
        run: |
          node --test tests/test_premiere.cjs
          python scripts/build-plugins.py
      - name: Build installable package
        run: python -m build
      - name: Test skill distribution from extracted source archive
        run: |
          source_dir=$(mktemp -d)
          tar -xzf dist/editstyle-*.tar.gz -C "$source_dir" --strip-components=1
          cd "$source_dir"
          python -S scripts/build-skill.py
          python -S -m unittest discover -s tests -p test_skill_bundle.py -v
      - name: Test wheel outside the checkout
        run: |
          python -m venv /tmp/editstyle-wheel
          /tmp/editstyle-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/editstyle-wheel/bin/editstyle list
